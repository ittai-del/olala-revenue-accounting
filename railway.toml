services:
  - type: worker
    name: olala-revenue-accounting
    runtime: node
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: GUESTY_CLIENT_ID
        sync: false
      - key: GUESTY_CLIENT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
